<title>Yemaya Ops</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --ink:#0C1B2E;--deep:#1A3050;--current:#0D7E8E;--foam:#4BBFCC;
  --pearl:#EFF5F8;--sand:#E3EDF4;--surface:#FFFFFF;
  --coral:#D4432A;--coral-bg:#FDECEA;
  --amber:#C9851C;--amber-bg:#FEF5E4;
  --emerald:#14956A;--emerald-bg:#E6F7F1;
  --violet:#6B53A4;--violet-bg:#F0EDF8;
  --t1:#0C1B2E;--t2:#456280;--t3:#8CA5BC;
  --bg:var(--pearl);--card:var(--surface);--border:#D0E2ED;
  --sidebar-w:220px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root{
  --pearl:#09192A;--sand:#0F2234;--surface:#132B40;
  --t1:#DDE8F0;--t2:#6A9AB8;--t3:#3D6480;
  --bg:var(--pearl);--card:var(--surface);--border:#1C3A54;
  --coral-bg:#3A1210;--amber-bg:#3A2608;--emerald-bg:#0A2B20;--violet-bg:#1E1933;
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%}
.app{display:flex;min-height:100%}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--deep);
  position:fixed;left:0;top:0;bottom:0;
  display:flex;flex-direction:column;overflow:hidden;z-index:200;
  background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:18px 18px;
}
.sb-logo{padding:20px 16px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.07)}
.logo-name{font-family:'DM Serif Display',Georgia,serif;font-style:italic;color:#fff;font-size:18px;letter-spacing:0.01em;line-height:1}
.logo-sub{font-size:8px;font-weight:600;letter-spacing:0.18em;color:var(--foam);text-transform:uppercase;margin-top:3px}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-label{font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.2);padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;
  color:rgba(255,255,255,0.45);font-size:13px;transition:background .12s,color .12s;position:relative;user-select:none}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8)}
.nav-item.active{background:rgba(13,126,142,0.2);color:#fff;font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--foam);border-radius:0 2px 2px 0}
.nav-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;line-height:1.5}
.sb-footer{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,0.07)}
.sb-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:0.04em}
.sb-round{font-size:11px;color:rgba(255,255,255,0.28);margin-top:2px}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 28px;height:50px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.tb-title{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:16px;color:var(--t1);white-space:nowrap}
.tb-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.tb-next{font-size:12px;color:var(--t3)}
.tb-next strong{color:var(--current);font-weight:500}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.runway-pill{display:flex;align-items:baseline;gap:4px;padding:3px 10px;border-radius:20px;background:var(--sand)}
.runway-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
.runway-lab{font-size:11px;color:var(--t3)}

/* CONTENT */
.content{padding:26px 28px;flex:1;max-width:1200px}
.view-head{margin-bottom:20px}
.view-title{font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--t1);margin-bottom:2px}
.view-sub{font-size:13px;color:var(--t2)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.card-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--t3);margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ACTION ITEM */
.action-item{display:flex;gap:0;align-items:stretch;border-bottom:1px solid var(--border)}
.action-item:last-child{border-bottom:none}
.action-stripe{width:3px;flex-shrink:0;border-radius:2px;margin:12px 0 12px 0}
.action-body{flex:1;padding:12px 14px;min-width:0}
.action-label{font-size:13px;font-weight:500;color:var(--t1);line-height:1.3}
.action-detail{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.45}
.action-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}

/* CHIP */
.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;line-height:1.6;white-space:nowrap}
.owner-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--sand);color:var(--t2)}
.sdot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--t3);
  text-align:left;padding:9px 12px;border-bottom:2px solid var(--border)}
.tbl td{padding:10px 12px;vertical-align:middle;border-bottom:1px solid var(--border);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--sand)}
.tbl tbody tr.expanded td{background:var(--sand)}

/* UTIL BAR */
.ubar-track{height:5px;border-radius:3px;background:var(--sand);overflow:hidden}
.ubar-fill{height:100%;border-radius:3px}

/* ALLOC STRIP */
.alloc-strip{height:5px;border-radius:3px;overflow:hidden;display:flex;gap:1px}

/* TIMELINE */
.tl-wrap{overflow-x:auto;padding-bottom:6px}
.tl-rail{display:flex;align-items:flex-start;min-width:max-content;padding:4px 0 0;position:relative}
.tl-item{display:flex;flex-direction:column;align-items:center;width:130px;cursor:pointer;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;top:10px;left:calc(50% + 11px);
  width:calc(100% - 22px);height:2px;background:var(--border);z-index:0}
.tl-dot{width:22px;height:22px;border-radius:50%;border:2px solid;background:var(--card);
  z-index:1;flex-shrink:0;transition:transform .15s;display:flex;align-items:center;justify-content:center}
.tl-item:hover .tl-dot,.tl-item.sel .tl-dot{transform:scale(1.18)}
.tl-name{font-size:11px;font-weight:500;color:var(--t1);text-align:center;margin-top:7px;line-height:1.25;max-width:110px}
.tl-q{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--t3);margin-top:3px}

/* PREREQ */
.prereq-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.prereq-row:last-child{border-bottom:none}
.prereq-wks{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);white-space:nowrap;min-width:44px;margin-top:2px}

/* SCENARIO */
.scen-tab{padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;
  border:1px solid var(--border);color:var(--t2);background:var(--card);transition:all .12s;font-family:inherit}
.scen-tab.active{color:#fff}
.ms-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ms-row:last-child{border-bottom:none}

/* RUNWAY VISUAL */
.rw-track{height:8px;border-radius:4px;background:var(--sand);overflow:hidden;position:relative}
.rw-fill{height:100%;border-radius:4px;background:var(--current);position:absolute;left:0;top:0}
.rw-marker{position:absolute;top:-4px;width:2px;height:16px;background:var(--coral);border-radius:1px}

/* INVESTOR DETAIL */
.inv-field{margin-bottom:12px}
.inv-field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:3px}
.inv-field-val{font-size:13px;color:var(--t1);line-height:1.5}

/* VENDOR EXPAND */
.vendor-expand{padding:10px 12px 14px 34px;background:var(--sand);border-bottom:1px solid var(--border)}

/* MISC */
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

/* MOBILE TAB BAR */
.mob-tabs{display:none;background:var(--card);border-bottom:1px solid var(--border);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mob-tabs::-webkit-scrollbar{display:none}
.mob-tabs-inner{display:flex;gap:0;padding:0 12px;min-width:max-content}
.mob-tab{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 14px;cursor:pointer;color:var(--t3);font-size:11px;font-weight:500;
  border-bottom:2px solid transparent;white-space:nowrap;user-select:none;transition:color .12s}
.mob-tab:hover{color:var(--t2)}
.mob-tab.active{color:var(--current);border-bottom-color:var(--current)}
.mob-tab svg{color:currentColor}
@media(max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0}
  .mob-tabs{display:block}
  .content{padding:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g3.stat-row{grid-template-columns:repeat(3,1fr);gap:8px}
  .tb-next{display:none}
}



/* HOME STAT TILE hover */
.stat-tile-hover:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);transform:translateY(-1px)}
/* INLINE EDITING */
[title="Click to edit status"]:hover,[title="Click to edit %"]:hover,[title="Click to edit"]:hover{
  outline:1.5px dashed var(--current);outline-offset:2px;border-radius:3px;
}
/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;cursor:default;position:relative}
.gantt-wrap::-webkit-scrollbar{height:6px}
.gantt-wrap::-webkit-scrollbar-track{background:var(--bg)}
.gantt-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.gantt-svg text{font-family:'DM Sans',sans-serif;fill:var(--t2)}
.gantt-svg .axis-yr{font-size:11px;font-weight:700;fill:var(--t1)}
.gantt-svg .axis-mo{font-size:10px;fill:var(--t3)}
.gantt-svg .lane-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.09em;fill:var(--t3)}
.gantt-svg .task-lbl{font-size:11px;fill:var(--t2)}
.gantt-svg .bar-complete{fill:#6B7280;opacity:0.85}
.gantt-svg .bar-on-track{fill:#0D7E8E}
.gantt-svg .bar-at-risk{fill:#C9851C}
.gantt-svg .bar-delayed{fill:#DC2626}
.gantt-svg .bar-not-started{fill:none;stroke:var(--border);stroke-width:1.5}
.gantt-svg .bar-critical.bar-on-track{fill:#0D7E8E;stroke:#065F67;stroke-width:1.5}
.gantt-svg .bar-critical.bar-at-risk{fill:#C9851C;stroke:#92400E;stroke-width:1.5}
.gantt-svg .bar-progress{fill:rgba(255,255,255,0.22)}
.gantt-svg .bar-external-cmo{stroke-dasharray:4,3}
.gantt-svg .bar-external-regulatory{stroke-dasharray:3,2;opacity:0.7}
.gantt-svg .today-line{stroke:#EF4444;stroke-width:1.5;stroke-dasharray:5,3;opacity:0.7}
.gantt-svg .gate-line{stroke:#1C2541;stroke-width:1;stroke-dasharray:6,3;opacity:0.55}
@media(prefers-color-scheme:dark){
  .gantt-svg .gate-line{stroke:#C8D6E5;opacity:0.35}
  .gantt-svg .today-line{opacity:0.6}
}
:root[data-theme="dark"] .gantt-svg .gate-line{stroke:#C8D6E5;opacity:0.35}

.gantt-tooltip{position:fixed;z-index:999;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 13px;box-shadow:0 6px 24px rgba(0,0,0,0.15);
  pointer-events:none;max-width:240px;min-width:180px}
.gantt-tooltip .tt-name{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.3}
.gantt-tooltip .tt-row{display:flex;gap:6px;align-items:baseline;margin-top:3px}
.gantt-tooltip .tt-lbl{font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.08em;color:var(--t3);min-width:48px}
.gantt-tooltip .tt-val{font-size:11px;color:var(--t2)}
.gantt-mode-btn{padding:5px 13px;border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:600;
  font-family:inherit;border:1px solid var(--border);background:var(--card);color:var(--t2);
  transition:all .12s}
.gantt-mode-btn.active{background:var(--current);color:#fff;border-color:var(--current)}


/* ── GANTT v2 ── */
.g2-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent}
.g2-wrap::-webkit-scrollbar{height:5px}
.g2-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.g2-svg text{font-family:'DM Sans',sans-serif}
.strip-zone{cursor:pointer}
.strip-zone:hover .strip-bg{opacity:0.22!important}
/* Task table */
.ttbl{width:100%;border-collapse:collapse;font-size:11.5px}
.ttbl th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;
  color:var(--t3);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;background:var(--bg)}
.ttbl td{padding:4px 8px;border-bottom:1px solid var(--border);color:var(--t2);
  vertical-align:middle;line-height:1.35}
.ttbl .prog-hdr td{background:var(--current);color:#fff;font-weight:700;font-size:11px;
  padding:5px 8px;letter-spacing:0.03em}
.ttbl .lane-hdr td{background:var(--bg);font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.09em;color:var(--t3);padding:3px 8px}
.ttbl .crit-row td:first-child{border-left:2px solid #DC2626}
.ttbl .risk-row td:first-child{border-left:2px solid #C9851C}
.pbar2{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.pbar2-track{width:44px;height:4px;background:var(--border);border-radius:2px;display:inline-block}
.pbar2-fill{height:4px;border-radius:2px;display:block}
.s-chip{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;
  text-transform:capitalize;letter-spacing:0.04em}
.gantt-tip{position:fixed;z-index:999;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;box-shadow:0 6px 24px rgba(0,0,0,0.14);
  pointer-events:none;max-width:230px;min-width:160px}
.gantt-tip .tn{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.3}
.gantt-tip .tr{display:flex;gap:5px;align-items:baseline;margin-top:2px}
.gantt-tip .tl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
  color:var(--t3);min-width:46px}
.gantt-tip .tv{font-size:11px;color:var(--t2)}

</style>
<div id="root"></div>

    rangeStart: prog.rangeStart||"2026-01-01",

    _stub:true,
  };

const ALERT_CONFIG={
  vendor:{critical:4,warn:10},
  investorStale:{warn:30},
};

function getAlertTier(value,key){
  const cfg=ALERT_CONFIG[key];
  if(!cfg)return"ok";
  if(value<=cfg.critical)return"critical";
  if(value<=cfg.warn)return"warn";
  return"ok";
}

function vendorNeedsAction(v){
  return !["contracted","active","complete"].includes(v.status)
    && v.weeksLeft>=0
    && getAlertTier(v.weeksLeft,"vendor")!=="ok";
}

        {rightLabel&&<span style={{fontSize:10,fontWeight:600,color:rightColor||"var(--t3)",
          whiteSpace:"nowrap",marginTop:1,fontFamily:"'JetBrains Mono',monospace"}}>{rightLabel}</span>}
      </div>
      <div className="action-detail">{detail}</div>
      <div className="action-tags">
        {(meta||[]).map((m,i)=><Chip key={i} label={m.label} color={m.color} bg={m.bg} small/>)}
        {(owners||[]).map(o=><Owner key={o} id={o}/>)}
      </div>
    </div>
  </div>;
}

function HomeView({setView}){
  const now=new Date();
  const in8wk=new Date(now.getTime()+8*7*24*3600*1000);
  const in10wk=new Date(now.getTime()+10*7*24*3600*1000);
  const in12wk=new Date(now.getTime()+12*7*24*3600*1000);

  /* ── vendor buckets ── */
  const overdueVendors=VENDORS
    .filter(v=>v.weeksLeft<0&&v.status==="active")
    .sort((a,b)=>a.weeksLeft-b.weeksLeft);
  const upcomingVendors=VENDORS
    .filter(v=>!["contracted","complete"].includes(v.status)&&v.weeksLeft>=0&&v.weeksLeft<=10)
    .sort((a,b)=>a.weeksLeft-b.weeksLeft);

  /* ── critical path buckets ── */
  const allCritBase=PROGRAMS.flatMap(prog=>{
    const tasks=getGantt(prog.id).tasks||[];
    return tasks.filter(t=>t.crit&&t.status!=="complete")
      .map(t=>({...t,prog,wksToEnd:Math.round((new Date(t.end)-now)/(7*24*3600*1000))}));
  });
  const critAtRisk=allCritBase.filter(t=>t.status==="at-risk")
    .sort((a,b)=>a.wksToEnd-b.wksToEnd);
  const critWatch=allCritBase.filter(t=>t.status==="not-started"&&new Date(t.end)<=in8wk)
    .sort((a,b)=>a.wksToEnd-b.wksToEnd);

  /* ── upcoming pub/conf milestones (within 12 weeks) ── */
  const upcomingEvents=PROGRAMS.flatMap(prog=>{
    return (getGantt(prog.id).tasks||[])
      .filter(t=>t.lane==="pub_conf"&&t.milestone&&t.status!=="complete")
      .map(t=>{const d=new Date(t.end);const wks=Math.round((d-now)/(7*24*3600*1000));return {...t,prog,wks};});
  }).filter(t=>t.wks>=-2&&t.wks<=12).sort((a,b)=>a.wks-b.wks);

  /* ── team capacity ── */
  const stretched=TEAM.filter(t=>t.ft&&(UTIL[t.id]||0)>85)
    .sort((a,b)=>(UTIL[b.id]||0)-(UTIL[a.id]||0));
  const stretchedHigh=stretched.filter(t=>(UTIL[t.id]||0)>=90);

  /* ── badge-worthy count (feeds sidebar) ── */
  const actionNowCount=overdueVendors.length+critAtRisk.length;
  const radarCount=upcomingVendors.length+critWatch.length+upcomingEvents.length;
  const stripe={critical:"var(--coral)",high:"var(--amber)",medium:"var(--current)",ops:"var(--violet)"};

  function CritRow(t){
    const past=t.wksToEnd<0;
    const laneLabel=t.lane.replace(/[0-9]/g,"").toUpperCase();
    return <ActionRow key={t.id}
      stripe={t.status==="at-risk"?stripe.critical:stripe.high}
      label={t.name}
      detail={t.risk||(past?`End date passed — delay cascades on critical path.`
        :t.wksToEnd===0?"Due this week":t.status==="not-started"?`Not started · ${t.wksToEnd}w to deadline`:`At risk · ${t.wksToEnd}w`)}
      rightLabel={past?`${Math.abs(t.wksToEnd)}w overdue`:t.wksToEnd===0?"This week":`${t.wksToEnd}w`}
      rightColor={past||t.status==="at-risk"?"var(--coral)":"var(--amber)"}
      meta={[
        {label:t.status==="at-risk"?"At Risk":"Not Started",
         color:t.status==="at-risk"?"#92400E":"#7F1D1D",
         bg:t.status==="at-risk"?"#FEF5E4":"#FDECEA"},
        {label:t.prog.code,color:t.prog.color,bg:"rgba(0,0,0,0.04)"},
        {label:laneLabel,color:"#374151",bg:"var(--sand)"},
      ]}/>;
  }

  return <div>
    <div className="view-head">
      <div className="view-title">This Week</div>
      <div className="view-sub">
        {actionNowCount>0
          ? <span style={{color:"var(--coral)",fontWeight:600}}>{actionNowCount} item{actionNowCount!==1?"s":""} need{actionNowCount===1?"s":""} immediate attention</span>
          : <span style={{color:"var(--green)"}}>No immediate action required</span>}
        {radarCount>0&&<span style={{color:"var(--t3)",marginLeft:8}}>· {radarCount} on radar</span>}
      </div>
    </div>

    {/* ── Stat tiles ── */}
    <div className="g3 stat-row" style={{marginBottom:20}}>
      {[
        {val:overdueVendors.length+critAtRisk.length, label:"Action Required", sub:"overdue or at-risk",
         color:"var(--coral)", dest:"vendors", desc:"Items needing immediate resolution"},
        {val:upcomingVendors.length+critWatch.length+upcomingEvents.length, label:"On Radar", sub:"upcoming in ≤10 weeks",
         color:"var(--amber)", dest:"vendors", desc:"Items to monitor this quarter"},
        {val:stretchedHigh.length, label:"Team Stretched", sub:"FTE at ≥90% util.",

      ].map(s=>(
        <div key={s.label} className="card" onClick={()=>setView(s.dest)}

      onViewAll={()=>setView("programs")} viewLabel="Programs →">
      {critAtRisk.length===0

    <div style={{display:"flex",alignItems:"center",gap:8,margin:"20px 0 10px"}}>
      <div style={{width:10,height:10,borderRadius:"50%",background:"var(--amber)",flexShrink:0}}/>
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.12em",color:"var(--amber)"}}>
        On Your Radar
      </span>
      <div style={{flex:1,height:1,background:"var(--amber)",opacity:0.25}}/>
      <span style={{fontSize:10,color:"var(--amber)",fontWeight:600}}>{radarCount}</span>
    </div>

    <SectionCard title="Upcoming Contract Deadlines" count={upcomingVendors.length}
      countColor="var(--amber)"

      onViewAll={()=>setView("vendors")} viewLabel="All vendors →">

        : upcomingVendors.map(v=>(

/* ── GANTT V2 ── */
function GanttChart2({mode, selProg="both", onMsClick, selMs}){
  const activePids=selProg==="both"?["p1","p2"]:[selProg];
  const [pastX, setPastX]=React.useState(false);
  const [futX,  setFutX ]=React.useState(false);
  const [tip,   setTip  ]=React.useState(null);
  const [tipPos,setTipPos]=React.useState({x:0,y:0});

  /* ── layout constants ── */
  const LW=162, RH=24, LH=24, PH=26, AH=44;
  const PX_DAY=1.07;  // ~32px/month in active zone
  const PS=58, FS=74;  // collapsed strip widths

  const RS=new Date("2025-01-01");   // range start (combined)
  const RE=new Date("2029-06-01");   // range end   (combined)
  const PC=new Date("2026-01-01");   // past cut (9 months ago)
  const FC=new Date("2028-04-01");   // future cut (~runway)
  const TODAY=new Date("2026-09-22");

  const daysRS_PC=(PC-RS)/864e5;
  const daysPC_FC=(FC-PC)/864e5;
  const daysFC_RE=(RE-FC)/864e5;

  const PW=pastX?Math.round(daysRS_PC*PX_DAY):PS;
  const AW=Math.round(daysPC_FC*PX_DAY);
  const FW=futX ?Math.round(daysFC_RE*PX_DAY):FS;
  const CW=PW+AW+FW;

  function toX(s){
    const d=new Date(s.length===7?s+"-01":s);
    const t=d.getTime();
    if(t<=PC.getTime()){
      return LW+Math.round(((t-RS.getTime())/(PC.getTime()-RS.getTime()))*PW);
    } else if(t>=FC.getTime()){
      const r=Math.min((t-FC.getTime())/(RE.getTime()-FC.getTime()),1);
      return LW+PW+AW+Math.round(r*FW);
    } else {
      return LW+PW+Math.round((t-PC.getTime())/864e5*PX_DAY);
    }
  }

  /* ── build row list ── */
  const MODE_INVESTOR=mode==="investor";

  /* ── group pids by indication ── */
  const indMap={};
  activePids.forEach(pid=>{
    const prog=PROGRAMS.find(p=>p.id===pid);
    const ind=prog?.indication||"Other";
    if(!indMap[ind])indMap[ind]=[];
    indMap[ind].push(pid);
  });
  const indGroups=Object.entries(indMap); // [[indication,[pid,...]],...]
  const multiInd=indGroups.length>1;

  const allRows=[];
  indGroups.forEach(([ind,pids])=>{
    if(multiInd) allRows.push({type:"indication",ind});
    pids.forEach(pid=>{
      const gd=getGantt(pid);
      const prog=PROGRAMS.find(p=>p.id===pid);
      allRows.push({type:"prog",pid,prog,gd});
      if(MODE_INVESTOR){
        gd.phases.forEach(ph=>allRows.push({type:"phase",phase:ph,pid,prog,gd}));
        allRows.push({type:"inv-zone",pid,prog,gd}); // label zone for milestone diamonds
      } else {
        gd.lanes.forEach(lane=>{
          allRows.push({type:"lane",lane,pid,prog});
          gd.tasks.filter(t=>t.lane===lane.id).forEach(t=>
            allRows.push({type:"task",task:t,lane,pid,prog}));
        });
      }
    });
  });

  /* ── pre-compute Y positions ── */
  const IH=20; // indication header height
  const rowY=[];
  let y=AH;
  allRows.forEach(r=>{
    rowY.push(y);
    if(r.type==="indication") y+=IH;
    else if(r.type==="prog") y+=PH;
    else if(r.type==="lane") y+=LH;
    else if(r.type==="phase") y+=32;
    else if(r.type==="inv-zone") y+=110;
    else y+=RH;
  });
  const SVG_H=y+12; // milestone zone height now included in inv-zone rows

  /* ── status helpers ── */
  function barFill(t,prog){
    if(t.status==="complete")   return"#6B7280";
    if(t.status==="at-risk")    return"#C9851C";
    if(t.status==="not-started")return"none";
    if(t.crit)                  return"#D4432A"; // critical path → red
    return prog.color;
  }
  function barStroke(t,prog){
    if(t.status==="not-started")return t.crit?"#A0200E":"var(--border)";
    if(t.crit) return"#A0200E";
    return"none";
  }
  function statusChipStyle(s){
    const m={complete:{bg:"rgba(107,114,128,0.13)",color:"#6B7280"},
      "on-track":{bg:"rgba(13,126,142,0.12)",color:"#0D7E8E"},
      "at-risk":{bg:"rgba(201,133,28,0.12)",color:"#C9851C"},
      "not-started":{bg:"rgba(0,0,0,0.05)",color:"var(--t3)"},
      delayed:{bg:"rgba(220,38,38,0.1)",color:"#DC2626"}};
    return m[s]||m["not-started"];
  }

  /* ── axis months ── */
  function monthsBetween(a,b){
    const r=[];
    let c=new Date(a.getFullYear(),a.getMonth(),1);
    while(c<=b){r.push(new Date(c));c=new Date(c.getFullYear(),c.getMonth()+1,1);}
    return r;
  }
  const MO_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  /* ── milestone Y (center of its lane's task area) ── */
  function getMsY(pid,laneId){
    const laneIdx=allRows.findIndex(r=>r.type==="lane"&&r.pid===pid&&r.lane.id===laneId);
    if(laneIdx<0) return AH+30;
    const laneYval=rowY[laneIdx];
    const gd=getGantt(pid);
    const nTasks=gd.tasks.filter(t=>t.lane===laneId).length;
    return laneYval+LH+nTasks*RH/2;
  }

  function showTip(e,data){
    setTip(data);
    setTipPos({x:e.clientX+14,y:e.clientY-10});
  }

  return <div style={{position:"relative"}}>
    <div className="g2-wrap">
      <svg className="g2-svg" width={LW+CW} height={SVG_H}
        style={{display:"block",minWidth:LW+CW}}>
        <defs>
          <pattern id="hh" patternUnits="userSpaceOnUse" width={7} height={7} patternTransform="rotate(45)">
            <line x1={0} y1={0} x2={0} y2={7} stroke="var(--t3)" strokeWidth={1.5} opacity={0.18}/>
          </pattern>
          <clipPath id="gc"><rect x={LW} y={0} width={CW} height={SVG_H}/></clipPath>
        </defs>

        {/* ── chart area bg ── */}
        <rect x={LW} y={AH} width={CW} height={SVG_H-AH} fill="var(--card)" opacity={0.45}/>

        {/* ── clipped chart content ── */}
        <g clipPath="url(#gc)">

          {/* vertical grid */}
          {monthsBetween(PC,FC).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            const isQ=mo.getMonth()%3===0;
            return <line key={i} x1={x} y1={AH} x2={x} y2={SVG_H}
              stroke="var(--border)" strokeWidth={isQ?0.7:0.25} opacity={isQ?0.55:0.3}/>;
          })}
          {pastX&&monthsBetween(RS,PC).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            return <line key={"pp"+i} x1={x} y1={AH} x2={x} y2={SVG_H}
              stroke="var(--border)" strokeWidth={0.25} opacity={0.25}/>;
          })}
          {futX&&monthsBetween(FC,RE).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            return <line key={"ff"+i} x1={x} y1={AH} x2={x} y2={SVG_H}
              stroke="var(--border)" strokeWidth={0.25} opacity={0.25}/>;
          })}

          {/* ── axis ── */}
          <rect x={LW} y={0} width={CW} height={AH} fill="var(--bg)" opacity={0.95}/>

          {/* past strip */}
          <g className="strip-zone" onClick={()=>setPastX(!pastX)} style={{cursor:"pointer"}}>
            <rect className="strip-bg" x={LW} y={0} width={PW} height={AH} fill="var(--border)" opacity={0.12}/>
            <rect x={LW} y={0} width={PW} height={AH} fill="url(#hh)"/>
            {!pastX
              ? <text x={LW+PW/2} y={AH/2+2} textAnchor="middle"
                  style={{fontSize:8.5,fontWeight:600,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
                  ◀ Pre-2026 · tap
                </text>
              : <text x={LW+6} y={14} style={{fontSize:9,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
                  ◀ Collapse
                </text>
            }
          </g>

          {/* active zone year + months */}
          {monthsBetween(PC,FC).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            const isQ=mo.getMonth()%3===0;
            return <React.Fragment key={"am"+i}>
              {mo.getMonth()===0&&<text x={x+3} y={14}
                style={{fontSize:10,fontWeight:700,fill:"var(--t1)",fontFamily:"'DM Sans',sans-serif"}}>
                {mo.getFullYear()}
              </text>}
              <line x1={x} y1={24} x2={x} y2={AH} stroke="var(--border)" strokeWidth={isQ?0.8:0.3}/>
              {isQ&&<text x={x+2} y={36}
                style={{fontSize:9,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
                {MO_NAMES[mo.getMonth()]}
              </text>}
            </React.Fragment>;
          })}

          {/* past expanded ticks */}
          {pastX&&monthsBetween(RS,PC).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            const isQ=mo.getMonth()%3===0;
            return <React.Fragment key={"pt"+i}>
              {mo.getMonth()===0&&<text x={x+2} y={14}
                style={{fontSize:9.5,fontWeight:700,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif",opacity:0.7}}>
                {mo.getFullYear()}
              </text>}
              {isQ&&<text x={x+2} y={36}
                style={{fontSize:8.5,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif",opacity:0.6}}>
                {MO_NAMES[mo.getMonth()]}
              </text>}
            </React.Fragment>;
          })}

          {/* future strip */}
          <g className="strip-zone" onClick={()=>setFutX(!futX)} style={{cursor:"pointer"}}>
            <rect className="strip-bg" x={LW+PW+AW} y={0} width={FW} height={AH} fill="var(--border)" opacity={0.08}/>
            <rect x={LW+PW+AW} y={0} width={FW} height={AH} fill="url(#hh)"/>
            {!futX
              ? <text x={LW+PW+AW+FW/2} y={AH/2+2} textAnchor="middle"
                  style={{fontSize:8.5,fontWeight:600,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
                  Post-runway ▶
                </text>
              : <text x={LW+PW+AW+6} y={14}
                  style={{fontSize:9,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>Collapse ▶</text>
            }
          </g>

          {/* future expanded ticks */}
          {futX&&monthsBetween(FC,RE).map((mo,i)=>{
            const x=toX(mo.toISOString().slice(0,7));
            const isQ=mo.getMonth()%3===0;
            return <React.Fragment key={"ft"+i}>
              {mo.getMonth()===0&&<text x={x+2} y={14}
                style={{fontSize:9.5,fontWeight:700,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif",opacity:0.7}}>
                {mo.getFullYear()}
              </text>}
              {isQ&&<text x={x+2} y={36}
                style={{fontSize:8.5,fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif",opacity:0.6}}>
                {MO_NAMES[mo.getMonth()]}
              </text>}
            </React.Fragment>;
          })}

          <line x1={LW} y1={AH} x2={LW+CW} y2={AH} stroke="var(--border)" strokeWidth={1}/>

          {/* ── rows (lane bgs + bars) ── */}
          {allRows.map((row,ri)=>{
            const ry=rowY[ri];
            if(row.type==="indication"){
              return <React.Fragment key={"indr"+ri}>
                <rect x={0} y={ry} width={LW+CW} height={IH} fill="var(--sand)" opacity={0.7}/>
                <line x1={0} y1={ry} x2={LW+CW} y2={ry} stroke="var(--border)" strokeWidth={0.6}/>
              </React.Fragment>;
            }
            if(row.type==="prog"){
              return <React.Fragment key={"pr"+ri}>
                <rect x={LW} y={ry} width={CW} height={PH}
                  fill={row.prog.color} opacity={0.1}/>
                <rect x={LW} y={ry} width={3} height={PH} fill={row.prog.color}/>
              </React.Fragment>;
            }
            if(row.type==="lane"){
              return <React.Fragment key={"lr"+ri}>
                <rect x={LW} y={ry} width={CW} height={LH} fill={row.lane.bg} opacity={0.6}/>
                <line x1={LW} y1={ry} x2={LW+CW} y2={ry} stroke="var(--border)" strokeWidth={0.4} opacity={0.4}/>
              </React.Fragment>;
            }
            if(row.type==="phase"){
              const ph=row.phase;
              const x1=toX(ph.start), x2=toX(ph.end);
              const bw=Math.max(x2-x1,8);
              const by=ry+5,bh=22;
              return <React.Fragment key={"phr"+ri}>
                <rect x={LW} y={ry} width={CW} height={32} fill="none"/>
                <rect x={x1} y={by} width={bw} height={bh} rx={4} fill={ph.color} opacity={0.75}/>
                {ph.pct>0&&<rect x={x1} y={by} width={Math.max(bw*ph.pct/100,3)} height={bh} rx={4}
                  fill={ph.color} opacity={1}/>}
                {bw>50&&ph.pct>0&&<text x={x1+6} y={by+bh/2+4}
                  style={{fontSize:9,fill:"#fff",fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>{ph.pct}%</text>}
              </React.Fragment>;
            }
            if(row.type==="task"){
              const t=row.task;
              const x1=toX(t.start),x2=toX(t.end);
              const bw=Math.max(x2-x1,3);
              const by=ry+4,bh=RH-8;

              /* pub_conf milestones → diamond marker */
              if(t.lane==="pub_conf"&&t.milestone){
                const mx=toX(t.end);
                const cy=ry+RH/2;
                const S=6;
                const done=t.status==="complete";
                return <React.Fragment key={t.id}>
                  <rect x={LW} y={ry} width={CW} height={RH} fill={row.lane.bg} opacity={0.35}/>
                  <polygon points={`${mx},${cy-S} ${mx+S},${cy} ${mx},${cy+S} ${mx-S},${cy}`}
                    fill={done?"#6B7280":"#6B53A4"} opacity={done?0.6:0.9}
                    onMouseEnter={e=>showTip(e,t)} onMouseLeave={()=>setTip(null)}
                    style={{cursor:"default"}}/>
                </React.Fragment>;
              }

              const fill=barFill(t,row.prog);
              const stroke=barStroke(t,row.prog);
              /* pub_conf task bars use purple */
              const pubFill=t.lane==="pub_conf"
                ?(t.status==="complete"?"#6B7280":t.status==="at-risk"?"#C9851C":"#6B53A4")
                :fill;
              return <React.Fragment key={t.id}>
                <rect x={LW} y={ry} width={CW} height={RH} fill={row.lane.bg} opacity={0.35}/>
                <rect x={x1} y={by} width={bw} height={bh} rx={2.5}
                  fill={t.lane==="pub_conf"?pubFill:fill} stroke={stroke}
                  strokeWidth={t.crit?1.5:t.status==="not-started"?1:0}
                  strokeDasharray={t.ext==="cmo"||t.ext==="cro"?"4,2.5":""}
                  opacity={t.status==="not-started"?1:0.85}
                  onMouseEnter={e=>showTip(e,t)} onMouseLeave={()=>setTip(null)}
                  style={{cursor:"default"}}/>
                {t.pct>0&&t.status!=="complete"&&<rect x={x1} y={by}
                  width={Math.max(bw*t.pct/100,2)} height={bh} rx={2.5}
                  fill="rgba(255,255,255,0.18)"/>}
                {bw>34&&t.pct>0&&<text x={x1+3} y={by+bh/2+3.5}
                  style={{fontSize:8,fill:"rgba(255,255,255,0.9)",fontWeight:700,
                    fontFamily:"'DM Sans',sans-serif"}}>{t.pct}%</text>}
              </React.Fragment>;
            }
            return null;
          })}

          {/* ── gate lines (staggered to avoid label collisions) ── */}
          {(()=>{
            const allGates=[...activePids.flatMap(pid=>getGantt(pid).gates.map(g=>({...g,pid})))];
            allGates.sort((a,b)=>a.date<b.date?-1:1);
            const gTrackRight=[-9999,-9999,-9999]; // 3-row greedy stagger
            return allGates.map(g=>{
              const gx=toX(g.date);
              const lblW=g.label.length*5.4+10;
              let row=2; // fallback
              for(let r=0;r<3;r++){if(gx>gTrackRight[r]+6){row=r;break;}}
              gTrackRight[row]=gx+lblW;
              const yOff=row*14;
              return <g key={g.pid+g.date}>
                <line x1={gx} y1={AH} x2={gx} y2={SVG_H}
                  stroke="var(--current)" strokeWidth={1} strokeDasharray="6,3" opacity={0.35}/>
                <rect x={gx+3} y={AH+3+yOff} width={lblW} height={12} rx={3}
                  fill="var(--current)" opacity={0.08}/>
                <text x={gx+5} y={AH+12+yOff}
                  style={{fontSize:8,fontWeight:700,fill:"var(--current)",
                    fontFamily:"'DM Sans',sans-serif"}}>{g.label}</text>
              </g>;
            });
          })()}

          {/* ── today line ── */}
          {(()=>{const tx=toX("2026-09-22");return<g>
            <line x1={tx} y1={AH} x2={tx} y2={SVG_H}
              stroke="#EF4444" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.65}/>
            <rect x={tx-13} y={AH-12} width={26} height={12} rx={3} fill="#EF4444" opacity={0.9}/>
            <text x={tx} y={AH-2} textAnchor="middle"
              style={{fontSize:7.5,fill:"#fff",fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>TODAY</text>
          </g>;})()}

          {/* ── milestones (operator mode only) ── */}
          {!MODE_INVESTOR&&activePids.map(pid=>
            getGantt(pid).milestones.map(m=>{
              const mx=toX(m.date);
              const my=getMsY(pid,m.lane);
              const mc=MS_COLORS[m.type]||"#6B7280";
              const isSel=selMs&&selMs.id===m.id;
              return <g key={m.id} style={{cursor:"pointer"}}
                onClick={()=>onMsClick&&onMsClick(m)}
                onMouseEnter={e=>showTip(e,{name:m.name,isMilestone:true,type:m.type,date:m.date})}
                onMouseLeave={()=>setTip(null)}>
                <polygon points={`${mx},${my-7} ${mx+7},${my} ${mx},${my+7} ${mx-7},${my}`}
                  fill={mc} stroke={isSel?"#fff":mc} strokeWidth={isSel?2:0} opacity={0.92}/>
              </g>;
            })
          )}

          {/* ── investor milestones ── */}
          {/* ── investor program divider bands ── */}
          {MODE_INVESTOR&&activePids.map((pid,pi)=>{
            if(pi===0) return null; // no divider before first program
            const progIdx=allRows.findIndex(r=>r.type==="prog"&&r.pid===pid);
            if(progIdx<0) return null;
            const dY=rowY[progIdx]-10;
            return <g key={"div"+pid}>
              <line x1={LW} y1={dY} x2={LW+CW} y2={dY}
                stroke="var(--border)" strokeWidth={1} opacity={0.5}/>
            </g>;
          })}

          {/* ── investor milestones ── */}
          {MODE_INVESTOR&&activePids.map(pid=>{
            const gd=getGantt(pid);
            const progRowIdx=allRows.findIndex(r=>r.type==="prog"&&r.pid===pid);
            const zoneIdx=allRows.findIndex(r=>r.type==="inv-zone"&&r.pid===pid);
            const baseY=rowY[progRowIdx]||AH;
            const afterPhasesY=zoneIdx>=0?(rowY[zoneIdx]+8):(baseY+PH+gd.phases.length*32+12);
            const laneTypeMap={reg:"regulatory",clinical:"clinical",pub_conf:"science",
              tox:"regulatory",cmc:"investor",invivo:"science",invivo2:"science",
              pharm:"science",disc:"science",abdisc:"science",leadopt:"science",
              tox2:"regulatory",cmc2:"investor",reg2:"regulatory"};

            // milestone=YES → Investor Gantt; milestone=NO → Operator only
            const dynMilestones=(gd.tasks||[])
              .filter(t=>t.milestone)
              .map(t=>({date:t.end,name:t.name,type:laneTypeMap[t.lane]||"investor"}));
            const rawMs=dynMilestones.length>0?dynMilestones:gd.invMilestones;

            // Sort chronologically for consistent track assignment
            const invMs=[...rawMs].sort((a,b)=>a.date<b.date?-1:1);

            // 3-track greedy label placement — avoids horizontal overlap per track
            const NTRACK=3;
            const trackRight=Array(NTRACK).fill(-9999);
            const trackOf=invMs.map(m=>{
              const mx=toX(m.date);
              const nm=m.name.length>22?m.name.slice(0,21)+"…":m.name;
              const lw=nm.length*5.4+14;
              for(let tr=0;tr<NTRACK;tr++){
                if(mx>trackRight[tr]+5){trackRight[tr]=mx+lw;return tr;}
              }
              trackRight[0]=Math.max(trackRight[0],toX(m.date)+lw);
              return 0;
            });

            // Stagger diamonds that land on the same X (within 8px)
            const mxArr=invMs.map(m=>toX(m.date));
            const diaOff=invMs.map((_,i)=>{
              let n=0;
              for(let j=0;j<i;j++){if(Math.abs(mxArr[j]-mxArr[i])<8)n++;}
              return n*14;
            });

            return invMs.map((m,mi)=>{
              const mx=toX(m.date);
              const mc=MS_COLORS[m.type]||MS_COLORS.investor;
              const diaY=afterPhasesY+10+diaOff[mi];
              const track=trackOf[mi];
              const lineEndY=afterPhasesY+36+track*22+6;
              const nm=m.name.length>22?m.name.slice(0,21)+"…":m.name;
              const lw=nm.length*5.4+14;
              // Flip label left when near right edge of chart
              const goLeft=mx+lw>LW+CW-12;
              return <g key={pid+m.date+mi}
                onMouseEnter={e=>showTip(e,{name:m.name,isMilestone:true,type:m.type,date:m.date})}
                onMouseLeave={()=>setTip(null)}>
                <line x1={mx} y1={diaY+7} x2={mx} y2={lineEndY-3}
                  stroke={mc} strokeWidth={1} strokeDasharray="3,2" opacity={0.35}/>
                <polygon points={`${mx},${diaY-7} ${mx+6},${diaY} ${mx},${diaY+7} ${mx-6},${diaY}`}
                  fill={mc} opacity={0.88}/>
                {goLeft
                  ?<React.Fragment>
                    <rect x={mx-lw-2} y={lineEndY-4} width={lw} height={13} rx={3} fill={mc} opacity={0.1}/>
                    <text x={mx-5} y={lineEndY+5} textAnchor="end"
                      style={{fontSize:8.5,fill:mc,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{nm}</text>
                  </React.Fragment>
                  :<React.Fragment>
                    <rect x={mx+2} y={lineEndY-4} width={lw} height={13} rx={3} fill={mc} opacity={0.1}/>
                    <text x={mx+4} y={lineEndY+5}
                      style={{fontSize:8.5,fill:mc,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{nm}</text>
                  </React.Fragment>
                }
              </g>;
            });
          })}

        </g>{/* end clip group */}

        {/* ── label column (on top) ── */}
        <rect x={0} y={0} width={LW} height={SVG_H} fill="var(--bg)" opacity={0.92}/>
        <line x1={LW} y1={0} x2={LW} y2={SVG_H} stroke="var(--border)" strokeWidth={1}/>

        {/* row labels */}
        {allRows.map((row,ri)=>{
          const ry=rowY[ri];
          if(row.type==="indication") return <text key={"indlbl"+ri} x={8} y={ry+IH/2+3.5}
            style={{fontSize:8.5,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.13em",
              fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
            {row.ind}
          </text>;
          if(row.type==="inv-zone") return null;
          if(row.type==="prog") return <text key={"ptxt"+ri} x={8} y={ry+PH/2+4}
            style={{fontSize:11,fontWeight:700,fill:row.prog.color,fontFamily:"'DM Sans',sans-serif"}}>
            {row.prog.name} · {row.prog.code}
          </text>;
          if(row.type==="lane") return <text key={"ltxt"+ri} x={8} y={ry+LH/2+4}
            style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",
              fill:"var(--t3)",fontFamily:"'DM Sans',sans-serif"}}>
            {row.lane.label}
          </text>;
          if(row.type==="phase") return <text key={"phtxt"+ri} x={LW-6} y={ry+32/2+4}
            textAnchor="end" style={{fontSize:10.5,fontWeight:600,fill:"var(--t1)",
              fontFamily:"'DM Sans',sans-serif"}}>
            {row.phase.name.length>22?row.phase.name.slice(0,21)+"…":row.phase.name}
          </text>;
          if(row.type==="task"){
            const t=row.task;
            const done=t.status==="complete";
            return <text key={"ttxt"+ri} x={LW-5} y={ry+RH/2+3.5} textAnchor="end"
              style={{fontSize:10,fill:done?"var(--t3)":"var(--t2)",fontFamily:"'DM Sans',sans-serif"}}>
              {t.name.length>23?t.name.slice(0,22)+"…":t.name}
            </text>;
          }
          return null;
        })}
      </svg>
    </div>

    {/* tooltip */}
    {tip&&<div className="gantt-tip" style={{left:tipPos.x,top:tipPos.y}}>
      <div className="tn">{tip.name}</div>
      {!tip.isMilestone&&<>
        {tip.vendor&&<div className="tr"><span className="tl">Vendor</span><span className="tv">{tip.vendor}</span></div>}
        <div className="tr"><span className="tl">Status</span>
          <span className="tv" style={{textTransform:"capitalize"}}>{tip.status?.replace(/-/g," ")}</span></div>
        {tip.pct>0&&<div className="tr"><span className="tl">Progress</span><span className="tv">{tip.pct}%</span></div>}
        {tip.crit&&<div className="tr"><span className="tl">Path</span>
          <span className="tv" style={{color:"#DC2626",fontWeight:700}}>Critical</span></div>}
        {tip.risk&&<div className="tr" style={{marginTop:5,paddingTop:5,borderTop:"1px solid var(--border)"}}>
          <span className="tl" style={{color:"#DC2626"}}>Risk</span>
          <span className="tv">{tip.risk}</span>
        </div>}
      </>}
      {tip.isMilestone&&<>
        <div className="tr"><span className="tl">Type</span>
          <span className="tv" style={{color:MS_COLORS[tip.type],fontWeight:600,textTransform:"capitalize"}}>{tip.type}</span></div>
        <div className="tr"><span className="tl">Target</span><span className="tv">{tip.date?.slice(0,7)}</span></div>
      </>}
    </div>}
  </div>;
}

/* ── TASK TABLE ── */
function TaskTable({selProg="both"}){
  const activePids=selProg==="both"?["p1","p2"]:[selProg];
  const sMap={complete:"complete","on-track":"on track","at-risk":"at risk",
    "not-started":"not started",delayed:"delayed"};
  const sStyle=s=>({
    complete:{bg:"rgba(107,114,128,0.12)",color:"#6B7280"},
    "on-track":{bg:"rgba(13,126,142,0.12)",color:"#0D7E8E"},
    "at-risk":{bg:"rgba(201,133,28,0.12)",color:"#C9851C"},
    "not-started":{bg:"rgba(0,0,0,0.06)",color:"var(--t3)"},
    delayed:{bg:"rgba(220,38,38,0.1)",color:"#DC2626"},
  }[s]||{bg:"rgba(0,0,0,0.05)",color:"var(--t3)"});

  function fmtDate(s){
    const [y,m]=s.slice(0,7).split("-");
    return MO_NAMES[+m-1]+" '"+y.slice(2);
  }
  const MO_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  return <div style={{overflowX:"auto"}}>
    <table className="ttbl">
      <thead><tr>
        <th style={{minWidth:180}}>Task</th>
        <th>Period</th>
        <th>Progress</th>
        <th>Status</th>
        <th>Vendor / Owner</th>
        <th>Risk</th>
      </tr></thead>
      <tbody>
        {(()=>{
          // group activePids by indication
          const tblIndMap={};
          activePids.forEach(pid=>{
            const prog=PROGRAMS.find(p=>p.id===pid);
            const ind=prog?.indication||"Other";
            if(!tblIndMap[ind])tblIndMap[ind]=[];
            tblIndMap[ind].push(pid);
          });
          const tblMultiInd=Object.keys(tblIndMap).length>1;
          return Object.entries(tblIndMap).map(([ind,pids])=>(
            <React.Fragment key={ind}>
              {tblMultiInd&&<tr>
                <td colSpan={6} style={{padding:"8px 12px 4px",fontSize:8.5,fontWeight:700,
                  letterSpacing:"0.13em",textTransform:"uppercase",color:"var(--t3)",
                  background:"var(--sand)",borderBottom:"1px solid var(--border)"}}>
                  {ind}
                </td>
              </tr>}
              {pids.map(pid=>{
          const gd=getGantt(pid);
          const prog=PROGRAMS.find(p=>p.id===pid);
          return <React.Fragment key={pid}>
            <tr className="prog-hdr">
              <td colSpan={6} style={{background:prog.color}}>
                {prog.name} · {prog.code}
              </td>
            </tr>
            {gd.lanes.map(lane=>{
              const tasks=gd.tasks.filter(t=>t.lane===lane.id);
              if(!tasks.length) return null;
              return <React.Fragment key={lane.id}>
                <tr className="lane-hdr">
                  <td colSpan={6}>{lane.label}</td>
                </tr>
                {tasks.map(t=>{
                  const ss=sStyle(t.status);
                  const isCrit=t.crit;
                  const isRisk=t.status==="at-risk";
                  return <tr key={t.id}
                    className={isCrit?"crit-row":isRisk?"risk-row":""}
                    style={{opacity:t.status==="complete"?0.65:1}}>
                    <td style={{fontWeight:isCrit?600:400}}>
                      {t.name}
                      {isCrit&&<span style={{fontSize:8.5,marginLeft:5,color:"#DC2626",
                        fontWeight:700,letterSpacing:"0.05em"}}>CRITICAL</span>}
                    </td>
                    <td className="mono" style={{whiteSpace:"nowrap",fontSize:10.5,color:"var(--t3)"}}>
                      {fmtDate(t.start)} – {fmtDate(t.end)}
                    </td>
                    <td>
                      {t.milestone
                        ? <span style={{color:t.status==="complete"?"#6B7280":"#6B53A4",fontSize:11}}>◆</span>
                        : t.status==="complete"
                          ? <span style={{color:"#6B7280",fontSize:10.5}}>✓ Done</span>
                          : <div className="pbar2">
                              <div className="pbar2-track">
                                <div className="pbar2-fill" style={{width:t.pct+"%",
                                  background:t.status==="at-risk"?"#C9851C":"var(--current)"}}/>
                              </div>
                              <span style={{fontSize:10,color:"var(--t3)"}}>{t.pct}%</span>
                            </div>
                      }
                    </td>
                    <td>
                      <span className="s-chip" style={{background:ss.bg,color:ss.color}}>
                        {sMap[t.status]||t.status}
                      </span>
                    </td>
                    <td style={{fontSize:10.5,color:"var(--t3)"}}>
                      {t.vendor||"—"}
                      {t.ext&&<span style={{marginLeft:4,fontSize:9,color:"var(--t3)",
                        background:"var(--bg)",padding:"1px 4px",borderRadius:3,border:"1px solid var(--border)"}}>

                      </span>}
                    </td>
                    <td style={{fontSize:10.5,color:isRisk?"#C9851C":"var(--t3)",maxWidth:200}}>
                      {t.risk||"—"}
                    </td>
                  </tr>;
                })}
              </React.Fragment>;
            })}
          </React.Fragment>;
              })}
            </React.Fragment>
          ));
        })()}
      </tbody>
    </table>
  </div>;
}

/* ── CAPITAL VIEW ── */
function CapitalView(){
  const [scen,setScen]=useState("base");
  const s=SCENARIOS.find(x=>x.id===scen)||SCENARIOS[1];
  const statusStyle={
    "on-track":   {color:"var(--emerald)",label:"On Track"},
    "accelerated":{color:"var(--current)",label:"Accelerated"},
    "delayed":    {color:"var(--amber)",label:"Delayed"},
    "risk":       {color:"var(--coral)",label:"At Risk"},
    "added":      {color:"var(--violet)",label:"Added"},
  };

  const rw=CAPITAL.runwayMonths;
  const total=CAPITAL.totalRunway;
  const pct=Math.min((rw/total)*100,100);
  const seriesBPct=Math.min(((total-CAPITAL.seriesBMonthsAway)/total)*100,100);

  // Program selector state (shared with embedded Gantt below)
  const allProgIds=PROGRAMS.map(p=>p.id);
  const [selProgs,setSelProgs]=useState(allProgIds);
  function toggleProg(id){
    setSelProgs(prev=>prev.includes(id)
      ? prev.length>1?prev.filter(x=>x!==id):prev
      : [...prev,id]);
  }

  // Gantt helpers — gpct avoids collision with runway pct variable
  const shiftDays=(SCENARIO_SHIFTS[scen]||0)*7;
  function shiftDate(iso){
    if(!iso) return iso;
    const d=new Date(iso); d.setDate(d.getDate()+shiftDays); return d.toISOString().slice(0,10);
  }

  // Gather crit=YES tasks for selected programs with scenario shift applied
  const critTasks=[];
  PROGRAMS.forEach(prog=>{
    if(!selProgs.includes(prog.id)) return;
    (getGantt(prog.id).tasks||[]).filter(t=>t.crit).forEach(t=>{
      critTasks.push({...t,prog,
        dispStart:scen==="base"?t.start:shiftDate(t.start),
        dispEnd:scen==="base"?t.end:shiftDate(t.end),
      });
    });
  });

  // Timeline bounds: include both scenario AND base dates so ghost bars never clip
  const nowD=new Date();
  const allDts=[
    ...critTasks.map(t=>new Date(t.dispStart)),
    ...critTasks.map(t=>new Date(t.dispEnd)),
    ...critTasks.map(t=>new Date(t.start)),
    ...critTasks.map(t=>new Date(t.end)),
  ];
  const minDt=allDts.length?new Date(Math.min(...allDts)):nowD;
  const maxDt=allDts.length?new Date(Math.max(...allDts)):nowD;
  minDt.setMonth(minDt.getMonth()-1);
  maxDt.setMonth(maxDt.getMonth()+2);
  const totalMs=maxDt-minDt;
  function gpct(iso){return Math.max(0,Math.min(100,((new Date(iso)-minDt)/totalMs)*100));}

  // Adaptive month labels — skip labels closer than 5% to prevent crowding
  const monthLabels=[];
  let lastLabelPct=-100;
  const cur=new Date(minDt.getFullYear(),minDt.getMonth(),1);
  while(cur<=maxDt){
    const p=((cur-minDt)/totalMs)*100;
    if(p-lastLabelPct>=5){
      monthLabels.push({label:cur.toLocaleString("default",{month:"short",year:"2-digit"}),pct:p});
      lastLabelPct=p;
    }
    cur.setMonth(cur.getMonth()+1);
  }

  const byProg={};
  critTasks.forEach(t=>{

const tabUrl=tab=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;

function parseCSVLine(line){
  const result=[];let cur="";let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur="";}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(lines.length<2)return[];
  const headers=parseCSVLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,""));
  return lines.slice(1).map(line=>{
    const vals=parseCSVLine(line);
    const row={};
    headers.forEach((h,i)=>row[h]=(vals[i]||"").trim().replace(/^"|"$/g,""));
    return row;
  });
}

function toVendors(rows){
  return rows.filter(r=>r.id).map(r=>({
    id:r.id,name:r.name,category:r.category,
    status:r.status||"not-started",
    weeksLeft:r.weeksLeft===""?99:+r.weeksLeft,
    risk:r.risk||"low",
    costExt:+r.costExt||0,
    payment:r.payment||"",
    owners:r.owners?r.owners.split(",").map(s=>s.trim()):[],
    note:r.note||"",
    riskNote:r.riskNote||"",
    lastUpdated:r.lastUpdated||"",
    deadline:(()=>{
      if(r.dueDate)return r.dueDate; // prefer explicit sheet value
      const wl=r.weeksLeft===""?99:+r.weeksLeft;
      if(wl===99||wl<0)return "";
      const d=new Date();d.setDate(d.getDate()+wl*7);
      return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    })(),
  }));
}

function toTeam(rows){
  return rows.filter(r=>r.id).map(r=>({
    id:r.id,name:r.name,role:r.role,
    ft:r.ft==="TRUE",
  }));
}

function toAllocation(rows){
  const obj={};
  rows.filter(r=>r.id).forEach(r=>{
    obj[r.id]={
      science:+r.science||0,
      investor:+r.investor||0,
      bd:+r.bd||0,
      strategic:+r.strategic||0,
      ops:+r.ops||0,
      conference:+r.conference||0,
    };
  });
  return obj;
}

function toUtil(rows){
  const obj={};
  rows.filter(r=>r.id).forEach(r=>obj[r.id]=+r.util||0);
  return obj;
}

function toTasks(rows){
  return rows.filter(r=>r.id).map(r=>{
    const t={id:r.id,lane:r.lane,name:r.name,
      start:r.start,end:r.end,
      pct:+r.pct||0,
      status:r.status||"not-started",
      crit:r.crit==="YES",
      milestone:(r.milestone||"").trim()==="YES",
    };
    if(r.ext)t.ext=r.ext;
    if(r.vendor)t.vendor=r.vendor;
    if(r.risk)t.risk=r.risk;
    if(r.note)t.note=r.note;
    return t;
  });
}

function toInvestors(rows){
  return rows.filter(r=>r.id).map(r=>({
    id:r.id,
    name:r.fund||r.name||r.id,
    tier:r.stage||r.tier||"Prospective",
    type:r.type||"VC",
    lead:r.contact||"",
    status:r.stage||r.status||"not-contacted",
    lastContact:r.lastContact||"—",
    priority:+r.priority||3,
    relationship:r.relationship||"",
    thesis:r.thesis||"",
    concerns:r.concerns||"",
    nextStep:r.nextStep||"—",
    roundRole:r.ownership||r.roundRole||"",
    owner:r.owner||"",
    notes:r.notes||"",
  }));
}

function toPrograms(rows){
  const COLOR_MAP={"p1":"#0D7E8E","p2":"#C9851C"};
  return rows.filter(r=>r.id).map(r=>({
    id:r.id,
    name:r.name||r.id,
    code:r.code||"",
    indication:r.indication||"",
    color:r.color||COLOR_MAP[r.id]||"#0D7E8E",
    rangeStart:r.rangeStart||"",
    rangeEnd:r.rangeEnd||"",
  }));
}


async function loadData(){
  const [vTxt,tTxt,uTxt,t1Txt,t2Txt,mTxt,iTxt,pTxt]=await Promise.all([
    fetch(tabUrl("Vendors")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Vendors tab (HTTP "+r.status+")");return r.text();}),
    fetch(tabUrl("Team")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Team tab");return r.text();}),
    fetch(tabUrl("Utilization")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Utilization tab");return r.text();}),
    fetch(tabUrl("Tasks_YEM001")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Tasks_YEM001 tab");return r.text();}),
    fetch(tabUrl("Tasks_YEM002")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Tasks_YEM002 tab");return r.text();}),
    fetch(tabUrl("Milestones")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Milestones tab");return r.text();}),
    fetch(tabUrl("Investors")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Investors tab");return r.text();}),
    fetch(tabUrl("Programs")).then(r=>{if(!r.ok)throw new Error("Cannot fetch Programs tab");return r.text();}),
  ]);
  VENDORS=toVendors(parseCSV(vTxt));
  const teamRows=parseCSV(tTxt);
  TEAM=toTeam(teamRows);
  ALLOCATION=toAllocation(teamRows);
  UTIL=toUtil(parseCSV(uTxt));
  GANTT.p1.tasks=toTasks(parseCSV(t1Txt));
  GANTT.p2.tasks=toTasks(parseCSV(t2Txt));
  // Merge milestone status from sheet into rich hardcoded MILESTONES
  parseCSV(mTxt).filter(r=>r.id).forEach(r=>{
    const ms=MILESTONES.find(x=>x.id===r.id);
    if(ms){
      if(r.status)ms.status=r.status;
      if(r.goalMin||r.goalTarget||r.goalStretch)
        ms.goals={minimum:r.goalMin||ms.goals.minimum,target:r.goalTarget||ms.goals.target,stretch:r.goalStretch||ms.goals.stretch};
    }
  });
  INVESTORS=toInvestors(parseCSV(iTxt));
  PROGRAMS=toPrograms(parseCSV(pTxt));
}

  const [view,setView]=useState("home");
  const [ready,setReady]=useState(false);
  const [loadError,setLoadError]=useState(null);

  function doLoad(){
    setReady(false);setLoadError(null);
    loadData()
      .then(()=>setReady(true))
      .catch(err=>{
        setLoadError(err.message||"Could not load data from Google Sheets. Check sharing settings.");
        setReady(true);
      });
  }

  useEffect(()=>{doLoad();},[]);

  if(!ready) return <LoadingSpinner/>;
  if(loadError) return <ErrorScreen error={loadError} onRetry={doLoad}/>;

  const views={home:HomeView,programs:ProgramsView,vendors:VendorsView,
    investors:InvestorsView,team:TeamView,capital:CapitalView};
  const View=views[view]||HomeView;
  return <div className="app">
    <Sidebar view={view} setView={setView}/>
    <div className="main">
      <TopBar view={view}/>
      <MobileTabBar view={view} setView={setView}/>
      <div className="content">
        <View setView={setView}/>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
